plugins {
    id 'java'
    id 'org.springframework.boot' version '2.2.0.RELEASE'
}

ext.nettyVersion = "4.1.42.Final"
def snakeVersion = "1.26"

dependencies {
    implementation "org.yaml:snakeyaml:${snakeVersion}"
    implementation "io.netty:netty-codec-http:$nettyVersion"
    implementation 'com.google.guava:guava:29.0-jre'
    api group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.65'
    compileOnly 'org.projectlombok:lombok:1.18.12'
    runtimeOnly 'mysql:mysql-connector-java:8.0.16'
    testImplementation 'org.mockito:mockito-core:3.3.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.3.1.Final'
}
