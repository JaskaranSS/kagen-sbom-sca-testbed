[tool.poetry]
name = "poetry-svc"
version = "0.5.0"
description = "Poetry-managed worker"
authors = ["Kagen QA"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "0.65.1"
starlette = "0.14.2"
pydantic = "1.6.1"
sqlalchemy = {version = "1.3.0", optional = true}

[tool.poetry.group.test.dependencies]
pytest = "6.2.1"

[tool.poetry.dev-dependencies]
mypy = "0.790"

[project]
name = "poetry-svc"
version = "0.5.0"
dependencies = ["httpx==0.22.0", "rsa==4.0"]

[project.optional-dependencies]
docs = ["sphinx==3.0.0"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
