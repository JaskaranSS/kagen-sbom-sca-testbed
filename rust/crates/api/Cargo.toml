[package]
name = "testbed-api"
version = "0.1.0"
edition = "2018"
license = "MIT OR Apache-2.0"

[dependencies]
hyper = "=0.14.9"
regex = "1.5.4"
tokio = { workspace = true }
time = { version = "0.1.43" }
smallvec = "=1.6.0"
local-helpers = { path = "../helpers" }
http-alias = { package = "http", version = "0.2.3" }

[dev-dependencies]
tempfile = "3.1.0"

[build-dependencies]
cc = "1.0"

[target.'cfg(unix)'.dependencies]
nix = "0.19.0"
